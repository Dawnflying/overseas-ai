# Redis 配置文件

# 网络配置
bind 0.0.0.0
port 6379
protected-mode no

# 持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 密码认证
requirepass jarvis@888

# 内存管理
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 数据库数量
databases 16

# 超时配置
timeout 300

# 日志级别
loglevel notice

# 连接配置
tcp-backlog 511
tcp-keepalive 300

# 快照配置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# 目录配置
dir /data

# AOF 重写配置
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# 客户端输出缓冲区限制
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# 性能优化
hz 10
dynamic-hz yes

