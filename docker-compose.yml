version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: overseas-ai-frontend:latest
    container_name: overseas-ai-frontend
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - overseas-ai-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: overseas-ai-backend:latest
    container_name: overseas-ai-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://frontend:80
      - LOG_LEVEL=info
    networks:
      - overseas-ai-network
    healthcheck:
      test: ["CMD", "node", "health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api`, `/ai`)"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  # 反向代理（可选）
  nginx-proxy:
    image: nginx:alpine
    container_name: overseas-ai-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf
    networks:
      - overseas-ai-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  overseas-ai-network:
    driver: bridge
    name: overseas-ai-network

volumes:
  backend-logs:
    driver: local
